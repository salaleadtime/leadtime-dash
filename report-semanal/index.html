<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Resumo Executivo Semanal — SALA Transformação</title>
<style>
:root{--ink:#182230;--muted:#64748b;--line:#e3e8f0;--paper:#fff;--canvas:#f4f7fb;--navy:#202c3d;--red:#ce1933;--red-deep:#a90e25;--blue:#2764d8;--green:#178667;--amber:#b76b00;--rose:#b4233c;--soft-red:#fff1f3;--soft-blue:#edf4ff;--soft-amber:#fff8ea;--soft-green:#e9f8f2;--shadow:0 12px 35px rgba(23,35,56,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:14px;line-height:1.42}
button,input,select,textarea{font:inherit}
.topbar{background:var(--navy);color:#fff;padding:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.bar-inner,.page{max-width:1100px;margin:auto;padding-left:24px;padding-right:24px}
.bar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:12px;font-weight:700;letter-spacing:.02em}
.period-control{display:flex;align-items:center;gap:4px;padding:5px 7px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#273345}
.period-copy small{display:block;color:#aab6c7;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.period-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:1px}
.period-row strong{font-size:11px;font-weight:600}
.period-step,.period-calendar{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:#dbe4f0;cursor:pointer;font-size:14px}
.period-step:hover,.period-calendar:hover{background:#35445a}
.period-calendar{position:relative;font-size:11px}
.period-calendar input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool{border:1px solid rgba(255,255,255,.18);background:#2b394c;color:#fff;border-radius:7px;padding:8px 11px;font-size:12px;font-weight:600;cursor:pointer}
.tool:hover{background:#3a4b61}
.tool.primary{background:var(--red);border-color:var(--red)}
.tool.primary:hover{background:var(--red-deep)}
.page{padding-top:24px;padding-bottom:44px}
.eyebrow{font-size:12px;font-weight:700;color:#485b74;margin:0 0 6px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.header h1{font-size:26px;line-height:1.1;letter-spacing:-.8px;margin:0;font-weight:650}
.freshness{border:1px solid #dce4ef;border-radius:12px;background:#fff;padding:8px 12px;color:#52657c;font-size:12px}
.freshness strong{color:var(--ink)}
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-top:4px solid var(--blue);padding:13px 12px;border-radius:10px;background:#fff;min-height:88px}
.kpi.red{border-top-color:var(--red)}
.kpi.green{border-top-color:var(--green)}
.kpi.amber{border-top-color:var(--amber)}
.kpi small{display:block;text-transform:uppercase;letter-spacing:.04em;font-size:9px;color:#52647a;font-weight:bold;min-height:22px}
.kpi b{display:block;font-size:26px;letter-spacing:-.6px;line-height:1.05;margin-top:3px}
.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px;box-shadow:0 2px 7px rgba(26,42,66,.025)}
.section-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.section-head h2{font-size:17px;letter-spacing:-.3px;margin:0}
.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:11px 12px;background:#fbfcfe}
.card.attn{border-left-color:var(--rose);background:var(--soft-red)}
.card.ok{border-left-color:var(--green);background:var(--soft-green)}
.card b{display:block;font-size:12px;color:#1e293b}
.card span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}
.card .badge{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:800;background:var(--soft-red);color:var(--rose)}
.empty{border:1px dashed #cbd5e1;border-radius:8px;padding:15px;color:var(--muted);background:#fbfdff;font-size:12px}
.jira-link{color:#2458b8;font-weight:700;text-decoration:none;border-bottom:1px solid #9bb8ed}
.jira-link:hover{color:var(--rose);border-bottom-color:var(--rose)}
.decision-list{display:grid;gap:8px}
.decision{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#fbfcfe}
.decision.done{opacity:.6}
.decision.done b{text-decoration:line-through}
.decision-main{min-width:0}
.decision b{display:block;font-size:12px;color:#1e293b}
.decision span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.decision-actions{display:flex;gap:5px;flex:0 0 auto}
.icon-btn{border:1px solid #d7e0e9;border-radius:7px;background:#fff;width:26px;height:26px;font-size:12px;color:#52647a}
.icon-btn:hover{background:#eef3f8}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:bold;color:#53647a;margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid #ccd7e5;border-radius:7px;padding:8px;background:#fff;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:1.4fr 1fr .9fr auto;gap:8px;align-items:end;margin-bottom:12px}
.note{font-size:11px;color:#677990;margin:10px 0 0}
.toast{position:fixed;right:16px;bottom:16px;background:#1f2b3d;color:#fff;padding:11px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:12px;z-index:50;display:none;max-width:320px}
.toast.show{display:block}
.loading{padding:42px;text-align:center;color:var(--muted)}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:1fr}}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media print{.topbar,.no-print{display:none!important}.page{max-width:none;padding:0}.section{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<nav class="topbar no-print"><div class="bar-inner">
  <div class="period-control">
    <button class="period-step" type="button" onclick="changeWeek(-1)" aria-label="Semana anterior">‹</button>
    <div class="period-copy"><small>Semana</small><div class="period-row"><strong id="weekLabel">—</strong><label class="period-calendar" title="Escolher semana">▦<input type="week" id="weekInput" onchange="setWeek(this.value)" aria-label="Escolher semana"></label></div></div>
    <button class="period-step" type="button" onclick="changeWeek(1)" aria-label="Próxima semana">›</button>
  </div>
  <div class="tools">
    <button class="tool primary" onclick="loadAll(true)">↻ Atualizar dados</button>
    <button class="tool" onclick="window.print()">⇩ Exportar PDF</button>
  </div>
</div></nav>
<main class="page">
  <header class="header">
    <div><p class="eyebrow">SALA Transformação / Report Semanal</p><h1>Resumo executivo semanal</h1></div>
    <div class="freshness" id="freshness"><strong>Base atualizada</strong> em —</div>
  </header>
  <div id="app"><div class="loading">Carregando resumo…</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var GAS='https://script.google.com/macros/s/AKfycbxOSQe41hqngh7b0iscE_Bcb_Z2mBfbwfqaaMCU_cKXDfCKnDvsQ6jb2HTPbnLso30C/exec';
  var state={rows:[],homolog:[],homologImportedAt:'',geralImportedAt:'',emergency:{rules:[]},summary:{decisions:[],deletedIds:[]},selectedWeek:'',errors:[]};
  var $=function(id){return document.getElementById(id)};

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function jsq(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}
  function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}

  // ═══ Transporte JSONP: 2 camadas de retry (Padrão de resiliência, CLAUDE.md) ═══
  function jsonp(url,timeoutMs,retriesLeft){
    retriesLeft=(retriesLeft===undefined)?1:retriesLeft;
    return new Promise(function(resolve,reject){
      var cb='resumoSemanal'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),timer;
      function retry(err){if(retriesLeft>0){setTimeout(function(){jsonp(url,timeoutMs,retriesLeft-1).then(resolve,reject)},2000)}else{reject(err)}}
      window[cb]=function(data){clearTimeout(timer);s.remove();delete window[cb];resolve(data)};
      s.onerror=function(){clearTimeout(timer);s.remove();delete window[cb];retry(new Error('Falha de rede'))};
      timer=setTimeout(function(){s.remove();delete window[cb];retry(new Error('Tempo esgotado'))},timeoutMs||28000);
      s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb+'&t='+Date.now();
      document.head.appendChild(s);
    });
  }
  // ═══ Retry de conteúdo: ok:false (contenção de lock do servidor) tenta de novo 1x ═══
  function vp(keyName,retriesLeft){
    retriesLeft=retriesLeft===undefined?1:retriesLeft;
    return jsonp(GAS+'?action=getVpData&key='+encodeURIComponent(keyName),28000,0).then(function(r){
      if(!r||!r.ok){
        if(retriesLeft>0)return new Promise(function(res){setTimeout(res,2000)}).then(function(){return vp(keyName,retriesLeft-1)});
        throw new Error((r&&r.error)||'Base indisponível');
      }
      return r.data;
    });
  }
  function asRows(data){return Array.isArray(data)?data:(data&&Array.isArray(data.rows)?data.rows:[])}

  function parseDate(v){
    if(!v)return null; if(v instanceof Date)return v;
    var s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m)return new Date(m[3].length===2?2000+(+m[3]):+m[3],+m[2]-1,+m[1]);
    return null;
  }
  function fmtDate(v){var d=parseDate(v);return d?d.toLocaleDateString('pt-BR'):'—'}
  function dateISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function isHom(row){return /homolog/.test(norm(row.situacao||row.status))}
  function stage(row){var s=norm(row.situacao||row.status);if(/deploy|producao/.test(s))return 'deploy';if(/homolog/.test(s))return 'homolog';if(/teste/.test(s))return 'teste';if(/desenvolvimento|em dev/.test(s))return 'dev';return 'other'}

  var BUSINESS_HOLIDAYS=['2026-01-01','2026-04-03','2026-04-21','2026-05-01','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25'];
  function isBusinessDate(d){return d&&d.getDay()!==0&&d.getDay()!==6&&BUSINESS_HOLIDAYS.indexOf(dateISO(d))<0}
  function businessDue(entry){var d=parseDate(entry);if(!d)return null;var added=0;while(added<3){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);if(isBusinessDate(d))added++}return d}
  function businessDaysAfter(due){if(!due)return null;var today=new Date(),end=new Date(today.getFullYear(),today.getMonth(),today.getDate()),cursor=new Date(due.getFullYear(),due.getMonth(),due.getDate());cursor.setDate(cursor.getDate()+1);var total=0;while(cursor<=end){if(isBusinessDate(cursor))total++;cursor.setDate(cursor.getDate()+1)}return total}

  function isoWeek(date){var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));var year=d.getUTCFullYear(),start=new Date(Date.UTC(year,0,1)),week=Math.ceil((((d-start)/86400000)+1)/7);return year+'-W'+String(week).padStart(2,'0')}
  function weekRange(code){var m=String(code||'').match(/^(\d{4})-W(\d{2})$/);if(!m)return null;var y=+m[1],w=+m[2],jan4=new Date(y,0,4),monday=new Date(y,0,4-((jan4.getDay()+6)%7)+(w-1)*7);monday.setHours(0,0,0,0);return {year:y,week:w,from:monday}}
  function updateWeekUi(){var range=weekRange(state.selectedWeek);if(!range)return;$('weekInput').value=state.selectedWeek;$('weekLabel').textContent='Semana '+range.week+', '+range.year;try{var url=new URL(location.href);url.searchParams.set('week',state.selectedWeek);history.replaceState(null,'',url)}catch(e){}}
  window.setWeek=function(code){if(!weekRange(code))return;state.selectedWeek=code;updateWeekUi();render()};
  window.changeWeek=function(delta){var range=weekRange(state.selectedWeek)||weekRange(isoWeek(new Date())),d=new Date(range.from);d.setDate(d.getDate()+(delta*7));setWeek(isoWeek(d))};

  function idFor(row){return row.chave||row.id||'—'}
  function titleFor(row){return row.resumo||row.summary||'História sem resumo'}
  function jiraKey(value){var match=String(value==null?'':value).match(/\bSLOPC-\d+\b/i);return match?match[0].toUpperCase():''}
  function jiraLink(code){var key=jiraKey(code);return key?'<a class="jira-link" href="https://jira.bradesco.com.br:8443/browse/'+key+'" target="_blank" rel="noopener">'+esc(key)+'</a>':esc(code||'—')}

  // ═══ Demandas Emergenciais: reaplica as MESMAS regras cadastradas em
  // index.html (chave emergencyDemand, {rules:[...]}) contra a base da Visão
  // de Projetos (vpGeral). Não é a mesma base de origem exata do backlog de
  // index.html (que soma backlog importado + stories do Jira + planilha de
  // homologação cruzada) — é uma aproximação deliberada para um resumo
  // enxuto, usando a MESMA definição de regra, não uma cópia de todo o
  // pipeline de importação do backlog.
  function ruleMatches(row,rule){
    if(!rule||rule.active===false)return false;
    var value=norm(rule.value),title=norm(titleFor(row)),labels=norm(row.labels||row.rotulos),squad=norm(row.squad);
    if(!value)return false;
    if(rule.type==='titleContains')return title.indexOf(value)>=0;
    if(rule.type==='labelAny')return value.split(/[|,;]+/).some(function(v){v=v.trim();return v&&labels.indexOf(v)>=0});
    if(rule.type==='squad')return squad===value;
    return title.indexOf(value)===0;
  }
  function isBlocked(row){return row.bloqueio||row.dependencia||row.impedimento||/bloque|dependen|imped/.test(norm([row.status,row.situacao,row.alerta].join(' ')))}
  function emergencyStories(){
    var rules=(state.emergency&&state.emergency.rules||[]).filter(function(r){return r&&r.active!==false});
    if(!rules.length)return [];
    var map={};
    (state.rows||[]).forEach(function(row){
      if(rules.some(function(r){return ruleMatches(row,r)}))map[idFor(row)]=row;
    });
    return Object.keys(map).map(function(k){return map[k]});
  }

  function nowText(){return new Date().toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}
  function dataUpdatedText(){var times=[];function add(v){var t=Date.parse(v||'');if(!isNaN(t))times.push(t)}add(state.geralImportedAt);add(state.homologImportedAt);if(!times.length)return nowText();return new Date(Math.max.apply(null,times)).toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}

  function metricCard(label,value,detail,cls){return '<article class="kpi '+(cls||'')+'"><small>'+esc(label)+'</small><b>'+value+'</b></article>'}

  function criticalHomolog(){
    return (state.homolog||[]).filter(isHom).map(function(row){var entry=parseDate(row.homologacaoData),due=businessDue(entry);return {row:row,due:due,lateDays:businessDaysAfter(due)}});
  }

  function render(){
    if(!state.rows.length && !state.homolog.length){
      $('app').innerHTML='<div class="loading">Não foi possível carregar a base. Use “Atualizar dados” para tentar novamente.</div>';
      return;
    }
    var count=function(p){return state.rows.filter(p).length};
    var metric={dev:count(function(r){return stage(r)==='dev'}),hom:count(function(r){return stage(r)==='homolog'}),teste:count(function(r){return stage(r)==='teste'}),deploy:count(function(r){return stage(r)==='deploy'})};
    var critical=criticalHomolog();
    var today=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
    var overdue=critical.filter(function(x){return x.due&&x.due<today});
    var emergency=emergencyStories();
    var emergencyAttn=emergency.filter(isBlocked);

    $('freshness').innerHTML='<strong>Base atualizada</strong> em '+esc(dataUpdatedText())+' BRT';

    // Avanços: itens já em Homologação ou Deploy (sinal de avanço disponível
    // na carga atual — não há histórico de mudança de status para comparar
    // semana a semana).
    var avancos=(state.rows||[]).filter(function(r){var s=stage(r);return s==='homolog'||s==='deploy'}).slice(0,5);
    // Atenções: SLA de homologação vencido primeiro (mais crítico), depois
    // demandas emergenciais com bloqueio/impedimento/dependência.
    var atencoes=overdue.slice(0,4).map(function(x){return {row:x.row,tag:'SLA VENCIDO',detail:(x.lateDays||0)+' dia(s) útil(eis) após o limite de 3 dias úteis.'}})
      .concat(emergencyAttn.slice(0,4).map(function(r){return {row:r,tag:'DEMANDA EMERGENCIAL',detail:'Bloqueio, impedimento ou dependência identificado na carga atual.'}}))
      .slice(0,6);

    $('app').innerHTML=''
      +'<section class="section"><div class="section-head"><div><h2>Panorama atual</h2><p>Estado da carteira na última carga do Jira (Acomp. Geral / Homologação).</p></div></div><div class="kpi-grid">'
      +metricCard('Em desenvolvimento',metric.dev,'','blue')
      +metricCard('Em homologação',metric.hom,'','amber')
      +metricCard('Em teste',metric.teste,'','blue')
      +metricCard('Em deploy',metric.deploy,'','green')
      +metricCard('SLA homologação vencido',overdue.length,'','red')
      +metricCard('Demandas emergenciais',emergency.length,'','red')
      +'</div></section>'
      +'<section class="section"><div class="section-head"><div><h2>Avanços da semana</h2><p>Itens que chegaram em homologação ou deploy na carga atual.</p></div></div>'
      +(avancos.length?'<div class="card-grid">'+avancos.map(function(r){return '<article class="card ok"><b>'+jiraLink(idFor(r))+'</b><span>'+esc(titleFor(r))+'</span><span>'+esc(r.squad||'Squad não informada')+' · '+esc(r.situacao||r.status||'—')+'</span></article>'}).join('')+'</div>':'<div class="empty">Nenhum item em homologação ou deploy na carga atual.</div>')
      +'</section>'
      +'<section class="section"><div class="section-head"><div><h2>Pontos de atenção</h2><p>SLA de homologação vencido e demandas emergenciais com bloqueio.</p></div></div>'
      +(atencoes.length?'<div class="card-grid">'+atencoes.map(function(x){return '<article class="card attn"><b>'+jiraLink(idFor(x.row))+'</b><span>'+esc(titleFor(x.row))+'</span><span>'+esc(x.row.squad||'Squad não informada')+'</span><span class="badge">'+esc(x.tag)+'</span><span>'+esc(x.detail)+'</span></article>'}).join('')+'</div>':'<div class="empty">Nenhum ponto crítico identificado na carga atual.</div>')
      +'</section>'
      +renderDecisions()
      +'<p class="note">Fontes: Visão de Projetos (Acomp. Geral, Homologação) e Demandas Emergenciais (regras cadastradas em index.html). Decisões pendentes são editadas aqui e sincronizadas para todos os navegadores.</p>';
  }

  function renderDecisions(){
    var decisions=selectedDecisions();
    return '<section class="section"><div class="section-head"><div><h2>Decisões pendentes da gestão</h2><p>Registradas para '+esc(weekText())+'. Ficam salvas para todo mundo.</p></div></div>'
      +'<div class="form-grid no-print">'
      +'<div class="field"><label>Decisão</label><input id="decTitle" placeholder="Ex.: Confirmar janela de homologação"></div>'
      +'<div class="field"><label>Responsável</label><input id="decOwner" placeholder="Nome ou papel"></div>'
      +'<div class="field"><label>Prazo</label><input id="decDue" type="date"></div>'
      +'<button class="tool primary" type="button" onclick="addDecision()">+ Adicionar</button>'
      +'</div>'
      +(decisions.length?'<div class="decision-list">'+decisions.map(function(d){return '<article class="decision '+(d.done?'done':'')+'"><div class="decision-main"><b>'+esc(d.title)+'</b><span>'+esc(d.owner||'Responsável não informado')+(d.dueDate?' · prazo '+esc(fmtDate(d.dueDate)):'')+'</span></div><div class="decision-actions no-print"><button class="icon-btn" title="'+(d.done?'Reabrir':'Concluir')+'" onclick="toggleDecision(\''+jsq(d.id)+'\')">'+(d.done?'↺':'✓')+'</button><button class="icon-btn" title="Excluir" onclick="deleteDecision(\''+jsq(d.id)+'\')">×</button></div></article>'}).join('')+'</div>':'<div class="empty">Nenhuma decisão registrada para esta semana.</div>')
      +'</section>';
  }

  function weekText(){var range=weekRange(state.selectedWeek);return range?'Semana '+range.week+', '+range.year:state.selectedWeek}
  function selectedDecisions(){return (state.summary.decisions||[]).filter(function(d){return d.week===state.selectedWeek})}

  function toast(msg){var t=$('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast'},3600)}
  function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  function stableJson(value){if(Array.isArray(value))return '['+value.map(stableJson).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(function(k){return JSON.stringify(k)+':'+stableJson(value[k])}).join(',')+'}';return JSON.stringify(value)}

  // ═══ Tumba de exclusão: sem isso, mesclar o remoto buscado antes de salvar
  // ressuscitaria uma decisão que este navegador acabou de excluir/concluir
  // e que ainda não chegou no servidor (mesmo padrão de vpQuickNotes/
  // discoveryPmoReportEdits, ver CLAUDE.md "Padrão de resiliência"). ═══
  function recordDeletion(id){var list=Array.isArray(state.summary.deletedIds)?state.summary.deletedIds:[];state.summary.deletedIds=list.filter(function(t){return t&&t.id!==id}).concat([{id:id,deletedAt:new Date().toISOString()}]).slice(-500)}
  function mergeTombstones(localTs,remoteTs){var out={};(Array.isArray(remoteTs)?remoteTs:[]).forEach(function(t){if(t&&t.id)out[t.id]=t});(Array.isArray(localTs)?localTs:[]).forEach(function(t){if(!t||!t.id)return;var existing=out[t.id];if(!existing||(Date.parse(t.deletedAt||'')||0)>=(Date.parse(existing.deletedAt||'')||0))out[t.id]=t});return out}
  function mergeDecisions(local,remote,deletedIds){var map={};function tomb(id){return !!deletedIds[id]}(Array.isArray(local)?local:[]).forEach(function(d){if(!d||!d.id||tomb(d.id))return;map[d.id]=d});(Array.isArray(remote)?remote:[]).forEach(function(d){if(!d||!d.id||tomb(d.id))return;var existing=map[d.id];if(!existing){map[d.id]=d;return}var rt=Date.parse(d.updatedAt||d.createdAt||'')||0,lt=Date.parse(existing.updatedAt||existing.createdAt||'')||0;if(rt>lt)map[d.id]=d});return Object.keys(map).map(function(k){return map[k]})}

  async function persistSummary(){
    try{
      var remote=await vp('vpWeeklySummaryNotes');
      var tsMap=mergeTombstones(state.summary.deletedIds,remote&&remote.deletedIds),deletedIds={};
      Object.keys(tsMap).forEach(function(k){deletedIds[k]=true});
      state.summary.deletedIds=Object.keys(tsMap).map(function(k){return tsMap[k]});
      state.summary.decisions=mergeDecisions(state.summary.decisions,remote&&remote.decisions,deletedIds);
    }catch(error){}
    localStorage.setItem('vpWeeklySummaryNotesLocal',JSON.stringify(state.summary));
    await fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=saveVpData&key=vpWeeklySummaryNotes&payload='+encodeURIComponent(JSON.stringify(state.summary))});
    var expected=stableJson(state.summary);
    for(var attempt=0;attempt<5;attempt++){
      await wait(700);
      try{var check=await vp('vpWeeklySummaryNotes');if(check&&stableJson(check)===expected)return true}catch(error){}
    }
    throw new Error('A alteração foi salva somente neste navegador; a confirmação da base compartilhada não retornou.');
  }

  window.addDecision=async function(){
    var title=($('decTitle').value||'').trim(),owner=($('decOwner').value||'').trim(),due=$('decDue').value;
    if(!title){toast('Informe o texto da decisão.');return}
    var stampNow=new Date().toISOString();
    state.summary.decisions.push({id:'dec-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title,owner:owner,dueDate:due,done:false,week:state.selectedWeek,createdAt:stampNow,updatedAt:stampNow});
    render();
    try{await persistSummary();render();toast('Decisão salva para '+weekText()+'.');$('decTitle').value='';$('decOwner').value='';$('decDue').value=''}
    catch(error){toast(error.message)}
  };
  window.toggleDecision=async function(id){
    var d=(state.summary.decisions||[]).filter(function(x){return x.id===id})[0];if(!d)return;
    d.done=!d.done;d.updatedAt=new Date().toISOString();
    render();
    try{await persistSummary();render();toast(d.done?'Decisão concluída.':'Decisão reaberta.')}
    catch(error){toast(error.message)}
  };
  window.deleteDecision=async function(id){
    var d=(state.summary.decisions||[]).filter(function(x){return x.id===id})[0];if(!d)return;
    if(!window.confirm('Excluir a decisão "'+d.title+'"?'))return;
    state.summary.decisions=state.summary.decisions.filter(function(x){return x.id!==id});
    recordDeletion(id);
    render();
    try{await persistSummary();render();toast('Decisão excluída.')}
    catch(error){toast(error.message)}
  };

  function loadLocalSummary(){try{var raw=JSON.parse(localStorage.getItem('vpWeeklySummaryNotesLocal')||'{}');return {decisions:Array.isArray(raw.decisions)?raw.decisions:[],deletedIds:Array.isArray(raw.deletedIds)?raw.deletedIds:[]}}catch(e){return {decisions:[],deletedIds:[]}}}

  window.loadAll=function(manual){
    $('app').innerHTML='<div class="loading">Carregando resumo…</div>';
    return Promise.allSettled([vp('vpGeral'),vp('vpHomologation'),vp('emergencyDemand'),vp('vpWeeklySummaryNotes')]).then(function(results){
      state.errors=[];
      function data(index,fallback){if(results[index].status==='fulfilled')return results[index].value;state.errors.push(results[index].reason&&results[index].reason.message||'falha');return fallback}
      var geralData=data(0,null);
      state.rows=asRows(geralData);
      state.geralImportedAt=(geralData&&geralData.importedAt)||'';
      var homologData=data(1,{rows:[]})||{rows:[]};
      state.homolog=asRows(homologData);
      state.homologImportedAt=homologData.importedAt||'';
      state.emergency=data(2,{rules:[]})||{rules:[]};
      var summaryData=data(3,null);
      state.summary=summaryData&&typeof summaryData==='object'?{decisions:Array.isArray(summaryData.decisions)?summaryData.decisions:[],deletedIds:Array.isArray(summaryData.deletedIds)?summaryData.deletedIds:[]}:loadLocalSummary();
      render();
      if(manual)toast(state.errors.length?'Resumo carregado com '+state.errors.length+' fonte(s) indisponível(is).':'Resumo atualizado.');
    });
  };

  state.selectedWeek=new URL(location.href).searchParams.get('week')||isoWeek(new Date());
  if(!weekRange(state.selectedWeek))state.selectedWeek=isoWeek(new Date());
  updateWeekUi();
  loadAll(false);
})();
</script>
</body></html>
