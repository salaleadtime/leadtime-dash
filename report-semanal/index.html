<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Resumo Executivo Semanal — SALA Transformação</title>
<!-- html2canvas vendorizado localmente (ver vendor/html2canvas.min.js) — o CDN
     público fica bloqueado em rede corporativa, mesmo padrão já usado em
     visao-projetos/report-semanal-operacional.html. -->
<script src="../vendor/html2canvas.min.js"></script>
<style>
:root{
  --navy:#0f1923;--navy-2:#182430;--red:#cc0000;--red-dark:#8b0000;
  --ink:#182230;--muted:#64748b;--line:#e3e8f0;--canvas:#eef1f6;--paper:#fff;
  --green:#178667;--green-soft:#e9f8f2;--amber:#b76b00;--amber-soft:#fff7e6;
  --rose:#b4233c;--rose-soft:#fff1f3;--blue:#2458b8;--blue-soft:#edf4ff;
  --purple:#6b4fbb;--purple-soft:#f2efff;
  --shadow:0 14px 34px rgba(15,25,35,.14)
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:13px;line-height:1.4}
button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.85}
.period-control{display:flex;align-items:center;gap:4px;padding:4px 6px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:#1e2c3b}
.period-control small{display:block;color:#9fb0c2;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.period-control strong{font-size:11px;font-weight:600}
.period-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:1px}
.period-step,.period-calendar{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border:0;border-radius:5px;background:transparent;color:#dbe4f0;cursor:pointer;font-size:13px}
.period-step:hover,.period-calendar:hover{background:#2c3d50}
.period-calendar{position:relative}
.period-calendar input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool{border:1px solid rgba(255,255,255,.18);background:#22303e;color:#fff;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer}
.tool:hover{background:#2c3d50}
.tool.primary{background:var(--red);border-color:var(--red)}
.tool.primary:hover{background:var(--red-dark)}
.page{max-width:900px;margin:18px auto 40px;padding:0 14px}
#captureArea{background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.hero{background:linear-gradient(120deg,var(--red) 0%,var(--red-dark) 55%,var(--navy) 100%);color:#fff;padding:16px 20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-eyebrow{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.85}
.hero h1{margin:4px 0 0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.hero-badge{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 9px;font-size:9px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.hero-meta{margin-top:8px;font-size:10px;opacity:.9}
.body-pad{padding:14px 20px 18px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:9px;padding:10px 12px;background:#fbfcfe}
.kpi.amber{border-top-color:var(--amber)}
.kpi small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:#5c6b80;font-weight:800}
.kpi b{display:block;font-size:24px;line-height:1.1;margin-top:3px;letter-spacing:-.4px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 7px}
.section-title .name{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#26364b;text-transform:uppercase;letter-spacing:.03em}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.section-title .badge-count{font-size:9px;font-weight:700;color:var(--muted)}
.block{margin-bottom:16px}
.empty{border:1px dashed #cbd5e1;border-radius:7px;padding:10px;color:var(--muted);background:#fbfdff;font-size:10px}
.manual-list{display:grid;gap:5px}
.manual-item{border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:7px;padding:6px 9px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:#fbfcfe}
.manual-item.risk{border-left-color:var(--rose)}
.manual-item.done{opacity:.55}
.manual-item.done b{text-decoration:line-through}
.manual-item b{display:block;font-size:10px;color:#1e293b}
.manual-item span{display:block;margin-top:2px;color:var(--muted);font-size:9px}
.manual-actions{display:flex;gap:4px;flex:0 0 auto}
.icon-btn{border:1px solid #d7e0e9;border-radius:6px;background:#fff;width:22px;height:22px;font-size:10px;color:#52647a;cursor:pointer}
.icon-btn:hover{background:#eef3f8}
.form-grid{display:grid;grid-template-columns:1.3fr 1fr .8fr auto;gap:6px;align-items:end;margin-bottom:9px}
.field label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.03em;font-weight:800;color:#53647a;margin-bottom:3px}
.field input{width:100%;border:1px solid #ccd7e5;border-radius:6px;padding:6px 7px;background:#fff;color:var(--ink);font-size:10px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.data-table{border-collapse:collapse;width:100%;font-size:10px}
.data-table th{background:#f7f9fc;color:#52647b;text-align:left;padding:6px 8px;font-size:8px;text-transform:uppercase;letter-spacing:.03em}
.data-table td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
.data-table .story{font-weight:700;color:#1e293b}
.data-table .story .sub{display:block;font-weight:400;color:var(--muted);margin-top:2px;max-width:260px}
.jira-link{color:var(--blue);font-weight:700;text-decoration:none}
.jira-link:hover{text-decoration:underline}
.sla-badge{display:inline-block;padding:2px 6px;border-radius:999px;font-size:8px;font-weight:800}
.sla-badge.ok{background:var(--green-soft);color:var(--green)}
.sla-badge.late{background:var(--rose-soft);color:var(--rose)}
.owner-btn{border:0;background:transparent;color:var(--blue);cursor:pointer;font-size:9px;font-weight:700;padding:0;text-decoration:underline}
.owner-set{color:#1e293b;font-weight:600}
.owner-edit{border:1px solid #d7e0e9;border-radius:5px;background:#fff;width:18px;height:18px;font-size:8px;color:#52647a;cursor:pointer;margin-left:3px}
.foot-note{padding:9px 20px 14px;font-size:9px;color:#7c8aa0;border-top:1px solid var(--line)}
.toast{position:fixed;right:14px;bottom:14px;background:#1f2b3d;color:#fff;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow);font-size:11px;z-index:80;display:none;max-width:300px}
.toast.show{display:block}
.loading{padding:36px;text-align:center;color:var(--muted)}
@media(max-width:760px){.kpi-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="topbar no-capture">
  <div class="brand">SALA TRANSFORMAÇÃO</div>
  <div class="period-control">
    <button class="period-step" type="button" onclick="changeWeek(-1)" aria-label="Semana anterior">‹</button>
    <div><small>Semana</small><div class="period-row"><strong id="weekLabel">—</strong><label class="period-calendar" title="Escolher semana">▦<input type="week" id="weekInput" onchange="setWeek(this.value)" aria-label="Escolher semana"></label></div></div>
    <button class="period-step" type="button" onclick="changeWeek(1)" aria-label="Próxima semana">›</button>
  </div>
  <div class="tools">
    <button class="tool" onclick="loadAll(true)">↻ Atualizar</button>
    <button class="tool primary" onclick="copyReportImage(this)">▣ Copiar / Baixar PNG</button>
  </div>
</nav>
<main class="page">
  <div id="captureArea"><div class="loading">Carregando resumo…</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var GAS='https://script.google.com/macros/s/AKfycbxOSQe41hqngh7b0iscE_Bcb_Z2mBfbwfqaaMCU_cKXDfCKnDvsQ6jb2HTPbnLso30C/exec';
  var state={rows:[],sprintRows:[],homolog:[],homologImportedAt:'',geralImportedAt:'',summary:{decisions:[],risks:[],milestones:[],homologOwners:{},deletedIds:[]},selectedWeek:'',errors:[]};
  var $=function(id){return document.getElementById(id)};

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function jsq(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}
  function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}

  // ═══ Transporte JSONP: 2 camadas de retry (Padrão de resiliência, CLAUDE.md) ═══
  function jsonp(url,timeoutMs,retriesLeft){
    retriesLeft=(retriesLeft===undefined)?1:retriesLeft;
    return new Promise(function(resolve,reject){
      var cb='resumoSemanal'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),timer;
      function retry(err){if(retriesLeft>0){setTimeout(function(){jsonp(url,timeoutMs,retriesLeft-1).then(resolve,reject)},2000)}else{reject(err)}}
      window[cb]=function(data){clearTimeout(timer);s.remove();delete window[cb];resolve(data)};
      s.onerror=function(){clearTimeout(timer);s.remove();delete window[cb];retry(new Error('Falha de rede'))};
      timer=setTimeout(function(){s.remove();delete window[cb];retry(new Error('Tempo esgotado'))},timeoutMs||28000);
      s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb+'&t='+Date.now();
      document.head.appendChild(s);
    });
  }
  // ═══ Retry de conteúdo: ok:false (contenção de lock do servidor) tenta de novo 1x ═══
  function vp(keyName,retriesLeft){
    retriesLeft=retriesLeft===undefined?1:retriesLeft;
    return jsonp(GAS+'?action=getVpData&key='+encodeURIComponent(keyName),28000,0).then(function(r){
      if(!r||!r.ok){
        if(retriesLeft>0)return new Promise(function(res){setTimeout(res,2000)}).then(function(){return vp(keyName,retriesLeft-1)});
        throw new Error((r&&r.error)||'Base indisponível');
      }
      return r.data;
    });
  }
  function asRows(data){return Array.isArray(data)?data:(data&&Array.isArray(data.rows)?data.rows:[])}

  function parseDate(v){
    if(!v)return null; if(v instanceof Date)return v;
    var s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m)return new Date(m[3].length===2?2000+(+m[3]):+m[3],+m[2]-1,+m[1]);
    return null;
  }
  function fmtDate(v){var d=parseDate(v);return d?d.toLocaleDateString('pt-BR'):'—'}
  function dateISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function isHom(row){return /homolog/.test(norm(row.situacao||row.status))}
  function isBacklog(row){return norm(row.situacao||row.status).indexOf('product backlog')>=0}

  var BUSINESS_HOLIDAYS=['2026-01-01','2026-04-03','2026-04-21','2026-05-01','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25'];
  function isBusinessDate(d){return d&&d.getDay()!==0&&d.getDay()!==6&&BUSINESS_HOLIDAYS.indexOf(dateISO(d))<0}
  function businessDue(entry){var d=parseDate(entry);if(!d)return null;var added=0;while(added<3){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);if(isBusinessDate(d))added++}return d}
  function businessDaysAfter(due){if(!due)return null;var today=new Date(),end=new Date(today.getFullYear(),today.getMonth(),today.getDate()),cursor=new Date(due.getFullYear(),due.getMonth(),due.getDate());cursor.setDate(cursor.getDate()+1);var total=0;while(cursor<=end){if(isBusinessDate(cursor))total++;cursor.setDate(cursor.getDate()+1)}return total}

  function isoWeek(date){var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));var year=d.getUTCFullYear(),start=new Date(Date.UTC(year,0,1)),week=Math.ceil((((d-start)/86400000)+1)/7);return year+'-W'+String(week).padStart(2,'0')}
  function weekRange(code){var m=String(code||'').match(/^(\d{4})-W(\d{2})$/);if(!m)return null;var y=+m[1],w=+m[2],jan4=new Date(y,0,4),monday=new Date(y,0,4-((jan4.getDay()+6)%7)+(w-1)*7);monday.setHours(0,0,0,0);return {year:y,week:w,from:monday}}
  function updateWeekUi(){var range=weekRange(state.selectedWeek);if(!range)return;$('weekInput').value=state.selectedWeek;$('weekLabel').textContent='Semana '+range.week+', '+range.year;try{var url=new URL(location.href);url.searchParams.set('week',state.selectedWeek);history.replaceState(null,'',url)}catch(e){}}
  window.setWeek=function(code){if(!weekRange(code))return;state.selectedWeek=code;updateWeekUi();render()};
  window.changeWeek=function(delta){var range=weekRange(state.selectedWeek)||weekRange(isoWeek(new Date())),d=new Date(range.from);d.setDate(d.getDate()+(delta*7));setWeek(isoWeek(d))};

  function idFor(row){return row.chave||row.id||'—'}
  function titleFor(row){return row.resumo||row.summary||'História sem resumo'}
  function jiraKey(value){var match=String(value==null?'':value).match(/\bSLOPC-\d+\b/i);return match?match[0].toUpperCase():''}
  function jiraLink(code){var key=jiraKey(code);return key?'<a class="jira-link" href="https://jira.bradesco.com.br:8443/browse/'+key+'" target="_blank" rel="noopener">'+esc(key)+'</a>':esc(code||'—')}

  function nowText(){return new Date().toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}
  function dataUpdatedText(){var times=[];function add(v){var t=Date.parse(v||'');if(!isNaN(t))times.push(t)}add(state.geralImportedAt);add(state.homologImportedAt);if(!times.length)return nowText();return new Date(Math.max.apply(null,times)).toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}

  function criticalHomolog(){
    return (state.homolog||[]).filter(isHom).map(function(row){var entry=parseDate(row.homologacaoData),due=businessDue(entry);return {row:row,entry:entry,due:due,lateDays:businessDaysAfter(due)}});
  }

  function render(){
    if(!state.rows.length && !state.homolog.length){
      $('captureArea').innerHTML='<div class="loading">Não foi possível carregar a base. Use “Atualizar” para tentar novamente.</div>';
      return;
    }
    var backlogCount=state.rows.filter(isBacklog).length;
    var sprintCount=state.sprintRows.length;
    var critical=criticalHomolog();
    var today=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
    var range=weekRange(state.selectedWeek);

    $('captureArea').innerHTML=''
      +'<div class="hero"><div class="hero-top"><div><div class="hero-eyebrow">SALA Transformação · Report Semanal</div><h1>Resumo Executivo Semanal</h1></div><div class="hero-badge">'+esc(range?'SEMANA '+range.week+'/'+range.year:'')+'</div></div><div class="hero-meta">Base atualizada em '+esc(dataUpdatedText())+' BRT</div></div>'
      +'<div class="body-pad">'
      +'<div class="block"><div class="kpi-grid">'
      +'<article class="kpi"><small>Histórias no Backlog</small><b>'+backlogCount+'</b></article>'
      +'<article class="kpi amber"><small>Histórias na Sprint</small><b>'+sprintCount+'</b></article>'
      +'</div></div>'
      +renderManualSection('risks','Riscos',['risk'])
      +renderManualSection('milestones','Marcos / Iniciativas concluídas',[])
      +renderHomologSection(critical,today)
      +'</div>'
      +'<p class="foot-note">Fontes: Visão de Projetos (Acomp. Geral, Sprint, Homologação). Riscos, Marcos e Responsável de homologação são editados aqui e ficam salvos para todo mundo.</p>';
  }

  // ═══ 3 listas manuais (Decisões, Riscos, Marcos) compartilham a mesma
  // estrutura de edição/sincronização — só o nome da lista e o rótulo do
  // campo de data mudam. ═══
  var MANUAL_LISTS={
    decisions:{label:'Decisão',dateLabel:'Prazo',cls:''},
    risks:{label:'Risco',dateLabel:'Identificado em',cls:'risk'},
    milestones:{label:'Marco / iniciativa',dateLabel:'Data',cls:''}
  };

  function selectedManualItems(list){return (state.summary[list]||[]).filter(function(d){return d.week===state.selectedWeek})}

  function renderManualSection(list,title,extraClasses){
    var def=MANUAL_LISTS[list],items=selectedManualItems(list);
    return '<div class="block"><div class="section-title"><span class="name"><span class="dot"></span>'+esc(title)+'</span><span class="badge-count">'+items.length+'</span></div>'
      +'<div class="form-grid no-capture">'
      +'<div class="field"><label>'+esc(def.label)+'</label><input id="'+list+'Title" placeholder="Descreva aqui"></div>'
      +'<div class="field"><label>Responsável</label><input id="'+list+'Owner" placeholder="Nome ou papel"></div>'
      +'<div class="field"><label>'+esc(def.dateLabel)+'</label><input id="'+list+'Due" type="date"></div>'
      +'<button class="tool primary" type="button" onclick="addManualItem(\''+list+'\')" style="height:29px">+ Adicionar</button>'
      +'</div>'
      +(items.length?'<div class="manual-list">'+items.map(function(d){return '<article class="manual-item '+esc(def.cls)+' '+(d.done?'done':'')+'"><div><b>'+esc(d.title)+'</b><span>'+esc(d.owner||'Responsável não informado')+(d.dueDate?' · '+esc(def.dateLabel.toLowerCase())+' '+esc(fmtDate(d.dueDate)):'')+'</span></div><div class="manual-actions no-capture"><button class="icon-btn" title="'+(d.done?'Reabrir':'Concluir')+'" onclick="toggleManualItem(\''+list+'\',\''+jsq(d.id)+'\')">'+(d.done?'↺':'✓')+'</button><button class="icon-btn" title="Excluir" onclick="deleteManualItem(\''+list+'\',\''+jsq(d.id)+'\')">×</button></div></article>'}).join('')+'</div>':'<div class="empty">Nenhum '+esc(def.label.toLowerCase())+' registrado para esta semana.</div>')
      +'</div>';
  }

  function renderHomologSection(critical,today){
    var owners=state.summary.homologOwners||{};
    var rows=critical.map(function(x){
      var storyId=idFor(x.row),owner=owners[storyId]||'',late=x.due&&x.due<today,days=x.lateDays==null?'—':x.lateDays;
      // O texto do responsável (nome ou "—") precisa SEMPRE aparecer na
      // captura — só o controle de edição (botão/link clicável) é
      // .no-capture. Uma célula em branco na imagem enviada por e-mail
      // pareceria dado faltando, não "ainda não definido".
      var ownerHtml=owner
        ?'<span class="owner-set">'+esc(owner)+'</span><button class="owner-edit no-capture" onclick="editHomologOwner(\''+jsq(storyId)+'\',\''+jsq(owner)+'\')" title="Editar responsável">✎</button>'
        :'<span class="owner-set" style="color:var(--muted)">—</span><button class="owner-btn no-capture" onclick="editHomologOwner(\''+jsq(storyId)+'\',\'\')" style="margin-left:4px">Definir</button>';
      return '<tr><td class="story">'+jiraLink(storyId)+'<span class="sub">'+esc(titleFor(x.row))+'</span></td><td>'+esc(x.row.squad||'—')+'</td><td>'+esc(fmtDate(x.entry))+'</td><td>'+ownerHtml+'</td><td><span class="sla-badge '+(late?'late':'ok')+'">'+(late?'Vencido · '+esc(days)+' dia(s)':'No prazo')+'</span></td></tr>';
    }).join('');
    return '<div class="block"><div class="section-title"><span class="name"><span class="dot"></span>Histórias em Homologação</span><span class="badge-count">'+critical.length+'</span></div>'
      +(critical.length?'<div class="table-wrap"><table class="data-table"><thead><tr><th>História</th><th>Squad</th><th>Data</th><th>Responsável</th><th>SLA</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Nenhuma história em homologação na carga atual.</div>')
      +'</div>';
  }

  function toast(msg){var t=$('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast'},3600)}
  function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  function stableJson(value){if(Array.isArray(value))return '['+value.map(stableJson).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(function(k){return JSON.stringify(k)+':'+stableJson(value[k])}).join(',')+'}';return JSON.stringify(value)}

  // ═══ Tumba de exclusão: sem isso, mesclar o remoto buscado antes de salvar
  // ressuscitaria um item que este navegador acabou de excluir/concluir e
  // que ainda não chegou no servidor (mesmo padrão de vpQuickNotes/
  // discoveryPmoReportEdits, ver CLAUDE.md "Padrão de resiliência"). Os ids
  // gerados por addManualItem já são únicos por lista (prefixo dec-/risk-/
  // ms-), então uma tumba única serve pras 3 listas. ═══
  function recordDeletion(id){var list=Array.isArray(state.summary.deletedIds)?state.summary.deletedIds:[];state.summary.deletedIds=list.filter(function(t){return t&&t.id!==id}).concat([{id:id,deletedAt:new Date().toISOString()}]).slice(-500)}
  function mergeTombstones(localTs,remoteTs){var out={};(Array.isArray(remoteTs)?remoteTs:[]).forEach(function(t){if(t&&t.id)out[t.id]=t});(Array.isArray(localTs)?localTs:[]).forEach(function(t){if(!t||!t.id)return;var existing=out[t.id];if(!existing||(Date.parse(t.deletedAt||'')||0)>=(Date.parse(existing.deletedAt||'')||0))out[t.id]=t});return out}
  function mergeItemList(local,remote,deletedIds){var map={};function tomb(id){return !!deletedIds[id]}(Array.isArray(local)?local:[]).forEach(function(d){if(!d||!d.id||tomb(d.id))return;map[d.id]=d});(Array.isArray(remote)?remote:[]).forEach(function(d){if(!d||!d.id||tomb(d.id))return;var existing=map[d.id];if(!existing){map[d.id]=d;return}var rt=Date.parse(d.updatedAt||d.createdAt||'')||0,lt=Date.parse(existing.updatedAt||existing.createdAt||'')||0;if(rt>lt)map[d.id]=d});return Object.keys(map).map(function(k){return map[k]})}
  // Mapa chave→valor (homologOwners): mesma classe de bug do histórico deste
  // repo (CLAUDE.md — "mapa dentro do mapa" do incidente de 14/08). Sem
  // mesclar por chave ANTES de enviar, reenviar o objeto inteiro sobrescreve
  // o responsável que outra pessoa acabou de definir para outra história —
  // o merge raso do servidor (mergeMap_) só enxerga "homologOwners" como UM
  // valor de topo, não o que tem dentro dele.
  function mergeOwnerMap(local,remote){var out={};Object.keys(remote||{}).forEach(function(k){out[k]=remote[k]});Object.keys(local||{}).forEach(function(k){out[k]=local[k]});return out}

  async function persistSummary(){
    try{
      var remote=await vp('vpWeeklySummaryNotes');
      var tsMap=mergeTombstones(state.summary.deletedIds,remote&&remote.deletedIds),deletedIds={};
      Object.keys(tsMap).forEach(function(k){deletedIds[k]=true});
      state.summary.deletedIds=Object.keys(tsMap).map(function(k){return tsMap[k]});
      state.summary.decisions=mergeItemList(state.summary.decisions,remote&&remote.decisions,deletedIds);
      state.summary.risks=mergeItemList(state.summary.risks,remote&&remote.risks,deletedIds);
      state.summary.milestones=mergeItemList(state.summary.milestones,remote&&remote.milestones,deletedIds);
      state.summary.homologOwners=mergeOwnerMap(state.summary.homologOwners,remote&&remote.homologOwners);
    }catch(error){}
    localStorage.setItem('vpWeeklySummaryNotesLocal',JSON.stringify(state.summary));
    await fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=saveVpData&key=vpWeeklySummaryNotes&payload='+encodeURIComponent(JSON.stringify(state.summary))});
    var expected=stableJson(state.summary);
    for(var attempt=0;attempt<5;attempt++){
      await wait(700);
      try{var check=await vp('vpWeeklySummaryNotes');if(check&&stableJson(check)===expected)return true}catch(error){}
    }
    throw new Error('A alteração foi salva somente neste navegador; a confirmação da base compartilhada não retornou.');
  }

  var LIST_PREFIX={decisions:'dec',risks:'risk',milestones:'ms'};

  window.addManualItem=async function(list){
    var title=($(list+'Title').value||'').trim(),owner=($(list+'Owner').value||'').trim(),due=$(list+'Due').value;
    if(!title){toast('Preencha o campo principal antes de adicionar.');return}
    var stampNow=new Date().toISOString();
    (state.summary[list]=state.summary[list]||[]).push({id:LIST_PREFIX[list]+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title,owner:owner,dueDate:due,done:false,week:state.selectedWeek,createdAt:stampNow,updatedAt:stampNow});
    render();
    try{await persistSummary();render();toast('Salvo para '+weekText()+'.');$(list+'Title').value='';$(list+'Owner').value='';$(list+'Due').value=''}
    catch(error){toast(error.message)}
  };
  window.toggleManualItem=async function(list,id){
    var d=(state.summary[list]||[]).filter(function(x){return x.id===id})[0];if(!d)return;
    d.done=!d.done;d.updatedAt=new Date().toISOString();
    render();
    try{await persistSummary();render();toast(d.done?'Marcado como concluído.':'Reaberto.')}
    catch(error){toast(error.message)}
  };
  window.deleteManualItem=async function(list,id){
    var d=(state.summary[list]||[]).filter(function(x){return x.id===id})[0];if(!d)return;
    if(!window.confirm('Excluir "'+d.title+'"?'))return;
    state.summary[list]=state.summary[list].filter(function(x){return x.id!==id});
    recordDeletion(id);
    render();
    try{await persistSummary();render();toast('Excluído.')}
    catch(error){toast(error.message)}
  };
  window.editHomologOwner=async function(storyId,current){
    var value=window.prompt('Responsável por '+storyId+':',current||'');
    if(value===null)return;
    value=value.trim();
    state.summary.homologOwners=state.summary.homologOwners||{};
    if(value)state.summary.homologOwners[storyId]=value; else delete state.summary.homologOwners[storyId];
    render();
    try{await persistSummary();render();toast('Responsável atualizado.')}
    catch(error){toast(error.message)}
  };

  function weekText(){var range=weekRange(state.selectedWeek);return range?'Semana '+range.week+', '+range.year:state.selectedWeek}

  function loadLocalSummary(){
    try{
      var raw=JSON.parse(localStorage.getItem('vpWeeklySummaryNotesLocal')||'{}');
      return {
        decisions:Array.isArray(raw.decisions)?raw.decisions:[],
        risks:Array.isArray(raw.risks)?raw.risks:[],
        milestones:Array.isArray(raw.milestones)?raw.milestones:[],
        homologOwners:raw.homologOwners&&typeof raw.homologOwners==='object'?raw.homologOwners:{},
        deletedIds:Array.isArray(raw.deletedIds)?raw.deletedIds:[]
      };
    }catch(e){return {decisions:[],risks:[],milestones:[],homologOwners:{},deletedIds:[]}}
  }

  window.loadAll=function(manual){
    $('captureArea').innerHTML='<div class="loading">Carregando resumo…</div>';
    return Promise.allSettled([vp('vpGeral'),vp('vpSprint'),vp('vpHomologation'),vp('vpWeeklySummaryNotes')]).then(function(results){
      state.errors=[];
      function data(index,fallback){if(results[index].status==='fulfilled')return results[index].value;state.errors.push(results[index].reason&&results[index].reason.message||'falha');return fallback}
      var geralData=data(0,null);
      state.rows=asRows(geralData);
      state.geralImportedAt=(geralData&&geralData.importedAt)||'';
      state.sprintRows=asRows(data(1,null));
      var homologData=data(2,{rows:[]})||{rows:[]};
      state.homolog=asRows(homologData);
      state.homologImportedAt=homologData.importedAt||'';
      var summaryData=data(3,null);
      state.summary=summaryData&&typeof summaryData==='object'
        ?{
            decisions:Array.isArray(summaryData.decisions)?summaryData.decisions:[],
            risks:Array.isArray(summaryData.risks)?summaryData.risks:[],
            milestones:Array.isArray(summaryData.milestones)?summaryData.milestones:[],
            homologOwners:summaryData.homologOwners&&typeof summaryData.homologOwners==='object'?summaryData.homologOwners:{},
            deletedIds:Array.isArray(summaryData.deletedIds)?summaryData.deletedIds:[]
          }
        :loadLocalSummary();
      render();
      if(manual)toast(state.errors.length?'Resumo carregado com '+state.errors.length+' fonte(s) indisponível(is).':'Resumo atualizado.');
    });
  };

  // ═══ Captura em PNG (copiar/baixar) — mesmo padrão comprovado de
  // report-semanal-operacional.html: html2canvas com windowWidth forçando
  // layout desktop e onclone travando a largura do card, pra não depender da
  // largura da janela de quem está clicando. Elementos .no-capture (toolbar,
  // formulários, botões de ação) não entram na imagem. ═══
  window.copyReportImage=async function(button){
    var original=button&&button.textContent,blob=null;
    try{
      if(typeof window.html2canvas!=='function')throw new Error('Biblioteca de captura indisponível');
      if(button){button.disabled=true;button.textContent='Preparando imagem…'}
      toast('Preparando imagem…');
      var area=$('captureArea');
      var canvas=await window.html2canvas(area,{
        scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,
        windowWidth:960,
        onclone:function(doc){
          var clone=doc.getElementById('captureArea');
          if(clone)clone.style.maxWidth='900px';
          Array.prototype.forEach.call(doc.querySelectorAll('.no-capture'),function(el){el.style.display='none'});
        }
      });
      blob=await new Promise(function(resolve,reject){canvas.toBlob(function(value){value?resolve(value):reject(new Error('Falha ao gerar PNG'))},'image/png',1)});
      if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        toast('Imagem copiada. Cole direto no corpo do e-mail ou Teams.');
      }else{
        throw new Error('Área de transferência indisponível');
      }
    }catch(error){
      if(blob){
        var link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='resumo-executivo-semanal.png';
        document.body.appendChild(link);link.click();link.remove();
        setTimeout(function(){URL.revokeObjectURL(link.href)},1500);
        toast('Imagem baixada (PNG).');
      }else{
        toast('Não foi possível gerar a imagem: '+(error&&error.message||'erro desconhecido')+'.');
      }
    }finally{
      if(button){button.disabled=false;button.textContent=original}
    }
  };

  state.selectedWeek=new URL(location.href).searchParams.get('week')||isoWeek(new Date());
  if(!weekRange(state.selectedWeek))state.selectedWeek=isoWeek(new Date());
  updateWeekUi();
  loadAll(false);
})();
</script>
</body></html>
